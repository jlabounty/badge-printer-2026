# Badge layout config. All positions/sizes are in inches from the top-left
# of the badge unless written as a percentage string (e.g. "50%").
version: 1

canvas:
  width_in: 4
  height_in: 3
  dpi: 250            # 4x3 in @ 250 dpi = 1000x750 px PNG
  rotate_output: 0    # 0 | 90 | 180 | 270 (applied to the exported PNG only)
  bleed_in: 0.06      # shrinks the whole layout inward to tolerate off-centre feeds

output:
  color_mode: greyscale   # greyscale | bw | color
  bw_threshold: 160       # 0-255, used by bw mode
  bw_dither: false        # Floyd-Steinberg dithering in bw mode (nicer for photos/logos)
  filename: "badge-{name}"

fonts:
  family: "Arial, Helvetica, sans-serif"

# Values available to text elements as {key}
vars: {}

# Form fields shown in the app, in order. Any key added here can be used in
# elements (field: key or "{key}") and in CSV imports. Fields with
# hidden: true are left off the form (toggle them in Settings → Fields).
fields:
  - { key: name, label: Full Name, required: true, placeholder: "Ada Lovelace" }
  - { key: pronouns, label: Pronouns, type: pronouns }
  - { key: company, label: Affiliation, placeholder: "Analytical Engines Ltd." }
  - { key: url, label: "Profile URL (LinkedIn, etc.)", type: url, placeholder: "https://linkedin.com/in/..." }
  - key: role
    label: Banner
    type: select
    allow_custom: true
    show_empty: true    # draw the banner strip even when blank
    options: ["", Speaker, Sponsor, Staff, Volunteer, Organizer, Expo Only, Full Conference]

pronoun_options:
  - she/her
  - he/him
  - they/them
  - she/they
  - he/they
  - xe/xem
  - ze/zir
  - any pronouns
  - ask me
pronoun_joiner: " · "     # joins entries that are not slash-mergeable (e.g. "any pronouns")

# Drawn in order. Common keys: x, y, w, h.
#   if: <field>    only draw when that field has a value
#   unless: <field> only draw when that field is empty
#   when: { <field>: { ...overrides } }  override keys when that field has a value
elements:
  - id: logo
    type: image
    src: assets/logo.png
    x: 0.9
    y: 0.08
    w: 2.2
    h: 0.78
    fit: contain
    align: center

  - type: text
    field: name
    x: 0.15
    y: 0.92
    w: 3.7
    h: 0.78
    size: 0.46
    min_size: 0.2
    max_lines: 3
    weight: 700
    align: center
    valign: middle

  # Only drawn when pronouns are filled in.
  - type: text
    field: pronouns
    x: 0.15
    y: 1.68
    w: 3.7
    h: 0.26
    size: 0.2
    min_size: 0.13
    style: italic
    align: center
    valign: middle

  - type: text
    field: company
    x: 0.15
    y: 1.68
    w: 3.7
    h: 0.42
    size: 0.27
    min_size: 0.15
    max_lines: 2
    weight: 700
    align: center
    valign: middle
    when:
      pronouns: { y: 1.98 }
      url: { x: 0.8, w: 2.4 }   # keep clear of the QR code

  - type: qr
    field: url
    x: 3.2
    y: 2.12
    size: 0.72
    quiet_zone: 2       # modules of white margin (badge whitespace adds the rest)
    when: { role: { x: 3.3, y: 1.98, size: 0.6 } }

  # Optional banner strip (Speaker / Sponsor / Staff ...)
  - { type: rect, if: role, x: 0, y: 2.6, w: 4, h: 0.4, fill: "#000" }
  - type: text
    if: role
    field: role
    x: 0.1
    y: 2.6
    w: 3.8
    h: 0.4
    size: 0.28
    min_size: 0.16
    weight: 800
    color: "#fff"
    transform: uppercase
    letter_spacing: 0.04
    align: center
    valign: middle
